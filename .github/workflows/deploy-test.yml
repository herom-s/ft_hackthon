name: Deploy Test (reusable)

# Called by deploy-test-aws.yml, deploy-test-azure.yml and deploy-test-gcp.yml.
on:
  workflow_call:
    inputs:
      cloud:
        description: aws, azure or gcp
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-test:
    name: Deploy ${{ inputs.cloud }} against floci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tofu-plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - name: Cache OpenTofu providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-providers-${{ inputs.cloud }}-${{ hashFiles(format('terraform/{0}/.terraform.lock.hcl', inputs.cloud)) }}

      # floci's EC2 pulls its guest image from ECR Public when an instance
      # launches, and shared runners hit ECR Public's anonymous rate limit.
      # Docker Hub serves the same image; floci skips the pull when it is
      # already present under the ECR name.
      - name: Pre-pull EC2 guest images
        if: inputs.cloud == 'aws'
        run: |
          docker pull ubuntu:24.04
          docker tag ubuntu:24.04 public.ecr.aws/docker/library/ubuntu:24.04
          docker pull alpine:3.21

      - name: Deploy, verify and destroy
        run: make test-deploy-${{ inputs.cloud }}

      - name: Emulator logs on failure
        if: failure()
        run: docker compose -f terraform/test/docker-compose.yml logs --tail=200

      - name: Stop emulators
        if: always()
        run: make floci-down
